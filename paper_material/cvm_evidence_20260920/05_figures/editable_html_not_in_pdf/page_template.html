*{box-sizing:border-box}body{margin:0;background:#eceff1;color:#28323c;font:13px/1.4 "Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;background:white;border:1px solid #c8cfd4;border-radius:4px;padding:6px 10px;cursor:pointer}button:hover{background:#eaf0f2}button:disabled{opacity:.42;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #54756e;outline-offset:2px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;padding:10px 16px;background:#fafbfc;border-bottom:1px solid #d5dce0}.toolbar strong{font-weight:600;margin-right:12px}.group{display:flex;align-items:center;gap:5px;padding-right:10px;margin-right:4px;border-right:1px solid #d5dce0}.group:last-child{border:0}.toolbar label{display:flex;gap:6px;align-items:center;white-space:nowrap}.toolbar input{accent-color:#54756e}.toolbar output{min-width:39px;text-align:center;font-variant-numeric:tabular-nums}#message{padding:7px 18px;color:#6a757e;background:#f5f7f8;border-bottom:1px solid #e0e4e7;font-size:12px}#viewport{width:100%;overflow:auto;padding:12px}#diagram{display:block;background:#fff;margin:0 auto;flex-shrink:0}.editing .node{cursor:move}.editing .edge-hit{pointer-events:stroke;cursor:pointer}.edge-hit{pointer-events:none}.node.selected>rect,.node.selected>ellipse,.node.selected>polygon{stroke-width:2.8}.edge.selected .edge-path{stroke-width:2.8}.point-handle{fill:white;stroke:#54756e;stroke-width:2;cursor:grab}.mid-handle{fill:#e8f0ed;stroke:#54756e;stroke-width:1;cursor:crosshair}.point-handle:hover{fill:#e8f0ed}#diagram{touch-action:pan-x pan-y}.editing #diagram{touch-action:none}body.clean .toolbar,body.clean #message{display:none}body.clean #viewport{padding:0;background:white}.return{display:none}body.clean .return{display:block;position:fixed;right:12px;bottom:12px;z-index:5;opacity:.7}@media(max-width:800px){.toolbar{gap:6px;padding:8px}.toolbar strong{display:none}#message{font-size:11px}.group{padding-ri
